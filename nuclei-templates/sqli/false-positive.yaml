id: sqli-false-positive

info:
  name: SQL Injection (SQLi)
  author: wafefficacy
  severity: info
  tags: sqli,false-positive

http:
  - payloads:
      sqli: sqli-false-positives.txt

    raw:
      - |
        GET /vulnerabilities/sqli/?id={{url_encode(sqli)}}{{suffix}} HTTP/1.1
        Host: {{Hostname}}
        Connection: close

      - |
        POST /vulnerabilities/sqli/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        id={{url_encode(sqli)}}{{suffix}}

    matchers:
      - type: status
        status:
          - 1
        negative: true
