id: traversal-true-positive

info:
  name: Traversal
  author: wafefficacy
  severity: info
  tags: traversal,true-positive

http:
  - payloads:
      traversal: true-positives.txt

    raw:
      - |
        GET /vulnerabilities/fi/?page={{url_encode(traversal)}}{{suffix}} HTTP/1.1
        Host: {{Hostname}}
        Connection: close

      - |
        POST /vulnerabilities/fi/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        page={{url_encode(traversal)}}{{suffix}}

    matchers:
      - type: status
        status:
          - 1
        negative: true
