id: traversal-false-positive

info:
  name: Traversal
  author: wafefficacy
  severity: info
  tags: traversal,false-positive

http:
  - payloads:
      traversal: false-positives.txt.encoded

    raw:
# GET doesn't add much value in this benchmark
#      - |
#        GET /vulnerabilities/fi/?page={{traversal}}{{suffix}} HTTP/1.1
#        Host: {{Hostname}}
#        Connection: close
      
      - |
        POST /vulnerabilities/fi/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        page={{traversal}}{{suffix}}

    matchers:
      - type: status
        status:
          - 1
        negative: true
