id: xss-false-positive

info:
  name: Cross Site Scripting (XSS)
  author: wafefficacy
  severity: info
  tags: xss,false-positive

http:
  - payloads:
      xss: false-positives.txt.encoded

    raw:
# GET doesn't add much value in this benchmark
#      - |
#        GET /vulnerabilities/xss_r/?name={{xss}}{{suffix}} HTTP/1.1
#        Host: {{Hostname}}
#        Connection: close

      - |
        POST /vulnerabilities/xss_r/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        name={{xss}}{{suffix}}

    matchers:
      - type: status
        status:
          - 1
        negative: true
