id: xss-false-positive

info:
  name: Cross Site Scripting (XSS)
  author: wafefficacy
  severity: info
  tags: xss,false-positive

http:
  - payloads:
      xss: false-positives.txt

    raw:
      - |
        GET /vulnerabilities/xss_r/?name={{url_encode(xss)}}{{suffix}} HTTP/1.1
        Host: {{Hostname}}
        Connection: close

      - |
        POST /vulnerabilities/xss_r/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        name={{url_encode(xss)}{{suffix}}}

    matchers:
      - type: status
        status:
          - 1
        negative: true
