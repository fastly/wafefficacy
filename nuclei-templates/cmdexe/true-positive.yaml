id: cmdexe-true-positive

info:
  name: Command Execution
  author: wafefficacy
  severity: info
  tags: cmdexe,true-positive

http:
  - payloads:
      cmdexe: cmdexe-true-positives.txt

    raw:
      - |
        GET /vulnerabilities/exec/?ip={{url_encode(cmdexe)}}{{suffix}} HTTP/1.1
        Host: {{Hostname}}
        Connection: close

      - |
        POST /vulnerabilities/exec/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        ip={{url_encode(cmdexe)}}{{suffix}}

    matchers:
      - type: status
        status:
          - 1
        negative: true
